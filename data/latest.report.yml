ted_at":"2026-11-27T15:13:05Z"},{"id":800957020,"node_id":"RA_kwDORwA07s4vvaJc","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":200,"digest":"sha256:75fde00fade77abad6b9d014d66697b85e27b014a016ebd9aff31c080af9f855","download_count":63,"created_at":"2026-11-27T15:13:05Z","updated_at":"2026-11-27T15:13:05Z"},{"id":800957031,"node_id":"RA_kwDORwA07s4vvaJn","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:f625055da99af69093b976fee980436da41cafa7cdbd0b2940eac12e067bb823","download_count":2,"created_at":"2026-11-27T15:13:05Z","updated_at":"2026-11-27T15:13:05Z"}],"body":"## Highlights\n\n- **More room for event names.** The Economic Calendar gives names more space in narrow panes, keeps ordinary figures readable, and shows the full name and figures when you open a row. (#3052, #3056, #3063)\n- **The accounting basis stays visible.** Financial Analysis shows which reporting basis a series uses, and listing valuations no longer borrow earnings from a predecessor company. (#3003, #3028, #3040, #3046)\n- **More panes follow a pinned time.** Pin the crosshair from a chart above a table and keep that time in view in linked panes, even when they don't have focus. (#3038)\n- **See which price sizes a position.** `KELLY` uses the regular-session valuation price for stocks and ETFs and shows the session and timestamp. (#3039)\n\n## Also in this release\n\n- Filings and ownership views link to more issuer disclosures across Asian markets. (#3031, #3033, #3035, #3037, #3049, #3051, #3053)\n- On Windows, CLI commands that save user data can wait longer when the database is busy. (#3061)\n- Position imports skip retired or ambiguous listings rather than substituting a different security; comparison exports retain the input rows, including duplicates and unavailable quotes. (#3062)\n- Open the dilution and custody guides directly from the app. (#3064)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.22...v0.20.23)\n"}
