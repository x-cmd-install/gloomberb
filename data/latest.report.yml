2026-11-13T17:18:37Z"},{"id":744500164,"node_id":"RA_kwDORwA07s4sYCvE","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":200,"digest":"sha256:dbeac416b2cebad68a5c4bced961356690b269073d42138c5b16f314ad4bafe3","download_count":62,"created_at":"2026-11-13T17:18:37Z","updated_at":"2026-11-13T17:18:37Z"},{"id":744500146,"node_id":"RA_kwDORwA07s4sYCuy","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:93c6cc1034f7da30142d63edd2ec8c71e511b25fb1b92f8dd5cc3d38595e089b","download_count":1,"created_at":"2026-11-13T17:18:36Z","updated_at":"2026-11-13T17:18:37Z"}],"body":"## Highlights\n\n- **Terminal panes fit what they show.** `OMON` keeps the puts in view and says how many fields it hid, `ECO` and Help show whole columns, the 5Y chart axis no longer skips a year, and Home, setup and the field picker fit narrow windows. (#2700)\n- **Dates and empty values read one way.** Dates are day-first (`18 Sep '25`), clocks name their zone with summer time, a missing value always shows the same mark, and terminal text wraps at spaces instead of inside numbers. (#2699)\n- **Search keeps Hong Kong and China lines.** `hsbc` lists HSBC's 0005 in Hong Kong again, `aia` finds 1299 and `ccb` finds 0939, and a slow first search no longer reads \"No matches\". (#2719)\n- **Log scale on the Overview chart.** A wide-ranging history such as NVDA's draws on a log axis by itself, and the pane menu has a switch that is remembered. (#2713)\n\n## Also in this release\n\n- Growth off a negative base and margins over negative revenue read N/M, and an insurer's EV reads N/M. (#2696)\n- German names: a bare ticker opens its home listing, European index moves are dated, and Xetra earnings fill in. (#2705, #2711)\n- Panes report a failed load instead of waiting silently, and a failed quote batch no longer retries in a loop. (#2708, #2709, #2710)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.12...v0.20.13)\n"}
