"state":"uploaded","size":293884548,"digest":"sha256:beb2a607579316671cdb873b3cfe4bbf61c2d2be4f76a25dd41c3df2d7d66e8d","download_count":3,"created_at":"2026-10-29T18:53:43Z","updated_at":"2026-10-29T18:53:56Z"},{"id":689567571,"node_id":"RA_kwDORwA07s4pGfdT","name":"stable-win-x64-GloomSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":293884548,"digest":"sha256:beb2a607579316671cdb873b3cfe4bbf61c2d2be4f76a25dd41c3df2d7d66e8d","download_count":310,"created_at":"2026-10-29T18:53:43Z","updated_at":"2026-10-29T18:53:57Z"},{"id":689567557,"node_id":"RA_kwDORwA07s4pGfdF","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":72,"digest":"sha256:2523a5e1e8131cee0ec8f8e9781222dd90d413496f81e9bed1ac466dd3925eb7","download_count":55,"created_at":"2026-10-29T18:53:43Z","updated_at":"2026-10-29T18:53:43Z"}],"body":"## Highlights\n\n- **The Windows app stays open on Arm PCs.** On Windows on Arm the desktop app closed about 10 seconds after it opened on most launches, in 0.19.1 and earlier versions too. It now stays open. (#2362)\n- **Fewer desktop freezes.** The desktop app no longer stalls for seconds while another program holds its database or while it checks plugins for updates after launch, and its stall reports say what it was waiting for. (#2348, #2355, #2358)\n- **Double-click the title bar to maximize.** On Windows a double-click on the header maximizes the window or restores it, as on a native title bar. (#2327)\n\n## Also in this release\n\n- A pane that falls back to a copy it saved earlier says `saved copy from 14:37` in its footer, the same way in every pane. (#2341)\n- Company names open the home listing, Enter opens exactly the highlighted row, net debt and EV count leases for companies that report under IFRS, and `catalog \"jet fuel\"` leads to heating oil and its `COT`. (#2350, #2356)\n- Popped-out windows from the last session open after the main window has drawn. (#2358)\n- Status bar chips centre their icon and letters. (#2354, #2357)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.19.1...v0.19.2)\n"}
